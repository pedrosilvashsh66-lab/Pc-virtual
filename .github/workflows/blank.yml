
name: Build PC Virtual Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Docker
        uses: docker/setup-buildx-action@v3

      - name: Construir PC Virtual
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pc-virtual:latest

      - name: Finalizado
        run: echo "Imagem do PC virtual criada!"
        
